name: CI & Deploy

on:
  push:
    branches:
      - main

jobs:
  quality:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: pytest backend/tests

  deploy:
    name: Build & Deploy Frontend
    needs: [quality, backend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Vite inlines VITE_* vars at build time. Without this the client
        # falls back to a relative /api path and hits the Pages domain
        # instead of the FastAPI backend on Render. The URL is public (it
        # ships in the bundle), so a repo secret is optional — the fallback
        # keeps the stats working if the secret is unset.
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://yuvrajkarna-api.onrender.com' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=yuvrajkarna

  # NOTE: The FastAPI backend is deployed on Render, which auto-deploys from
  # this repo on push to main. No deploy step is needed here — the
  # backend-tests job above gates that deploy by failing the pipeline on a
  # broken backend. If you ever move off Render's auto-deploy, add a deploy
  # job here that depends on [quality, backend-tests].
